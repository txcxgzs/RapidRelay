<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidRelay - 文件加速下载服务</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(18, 18, 26, 0.8);
            --accent-primary: #00f5d4;
            --accent-secondary: #7b2cbf;
            --accent-tertiary: #ff6b6b;
            --accent-warning: #ffb800;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-primary: rgba(0, 245, 212, 0.15);
            --glow-secondary: rgba(123, 44, 191, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, var(--glow-secondary), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, var(--glow-primary), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: var(--accent-primary);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: var(--accent-secondary);
            top: 60%;
            right: 10%;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: var(--accent-tertiary);
            bottom: 20%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            75% {
                transform: translate(20px, 30px) scale(1.05);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 32px;
            align-items: start;
        }

        .main-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 20px;
            margin-bottom: 28px;
            position: relative;
            box-shadow: 
                0 0 60px rgba(0, 245, 212, 0.3),
                0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            border-radius: 22px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
        }

        @keyframes borderRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .logo-icon {
            font-size: 36px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 50%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0.5;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title svg {
            width: 18px;
            height: 18px;
            color: var(--accent-primary);
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            color: var(--accent-primary);
            font-size: 20px;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .input-field {
            width: 100%;
            padding: 18px 20px 18px 56px;
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:focus {
            border-color: var(--accent-primary);
            background: rgba(0, 245, 212, 0.03);
            box-shadow: 0 0 30px rgba(0, 245, 212, 0.1);
        }

        .api-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .api-btn {
            padding: 14px 18px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .api-btn.primary {
            background: linear-gradient(135deg, var(--accent-secondary), #9b4dca);
            border: none;
            color: white;
        }

        .api-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.3);
        }

        .api-btn.secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .api-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .api-btn svg {
            width: 16px;
            height: 16px;
        }

        .result-box {
            margin-top: 16px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .result-url {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-primary);
            word-break: break-all;
            padding: 12px;
            background: rgba(0, 245, 212, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .copy-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 6px;
            color: var(--accent-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(0, 245, 212, 0.2);
        }

        .copy-btn.copied {
            background: rgba(0, 245, 212, 0.3);
            color: white;
        }

        .status-message {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .status-message.success {
            display: flex;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            color: var(--accent-primary);
        }

        .status-message.error {
            display: flex;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--accent-tertiary);
        }

        .status-icon {
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 245, 212, 0.3);
        }

        .stat-card.highlight {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(0, 245, 212, 0.1), rgba(123, 44, 191, 0.1));
            border-color: rgba(0, 245, 212, 0.3);
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .stat-value.small {
            font-size: 22px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-card.highlight .stat-value {
            font-size: 36px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--accent-primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .downloads-panel {
            max-height: 300px;
            overflow-y: auto;
        }

        .downloads-panel::-webkit-scrollbar {
            width: 6px;
        }

        .downloads-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 3px;
        }

        .downloads-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .downloads-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .download-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .download-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .download-item:last-child {
            margin-bottom: 0;
        }

        .download-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .download-filename {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .download-speed {
            font-size: 14px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-primary);
            margin-left: 12px;
        }

        .download-progress {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .download-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .download-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .no-downloads {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .no-downloads svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: -1;
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }
            
            .hero p {
                font-size: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card.highlight {
                grid-column: span 1;
            }

            .api-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-bg"></div>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="main-section">
            <div class="hero">
                <div class="logo-container">
                    <span class="logo-icon">⚡</span>
                </div>
                <h1>RapidRelay</h1>
                <p>高速文件加速下载服务</p>
            </div>

            <div class="card" style="animation-delay: 0.1s;">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7,10 12,15 17,10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    文件下载
                </div>
                <div class="input-wrapper">
                    <label class="input-label">文件链接</label>
                    <div class="input-container">
                        <input 
                            type="text" 
                            id="fileUrl" 
                            class="input-field" 
                            placeholder="粘贴 OneDrive、GitHub 等文件链接..."
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <span class="input-icon">🔗</span>
                    </div>
                </div>

                <div class="api-actions">
                    <button class="api-btn primary" onclick="getAccelerateLink()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                        </svg>
                        获取加速链接
                    </button>
                    <button class="api-btn secondary" onclick="startDownload()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7,10 12,15 17,10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        直接下载
                    </button>
                </div>

                <div id="resultBox" class="result-box">
                    <div class="result-label">加速链接</div>
                    <div id="resultUrl" class="result-url"></div>
                    <button id="copyBtn" class="copy-btn" onclick="copyLink()">复制链接</button>
                </div>

                <div id="statusMessage" class="status-message">
                    <span class="status-icon"></span>
                    <span class="status-text"></span>
                </div>
            </div>

            <div class="card" style="animation-delay: 0.2s;">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12,6 12,12 16,14"/>
                    </svg>
                    使用说明
                </div>
                <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.8;">
                    <p style="margin-bottom: 12px;">1. 粘贴文件链接到上方输入框</p>
                    <p style="margin-bottom: 12px;">2. 点击「获取加速链接」生成可分享的链接</p>
                    <p style="margin-bottom: 12px;">3. 或点击「直接下载」立即开始下载</p>
                    <p>4. API 调用: <code style="color: var(--accent-primary); font-family: 'JetBrains Mono', monospace;">/api/accelerate?url=&lt;链接&gt;</code></p>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card" style="animation-delay: 0.3s;">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    LIVE
                </div>
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10"/>
                        <path d="M12 20V4"/>
                        <path d="M6 20v-6"/>
                    </svg>
                    实时统计
                </div>
                <div class="stats-grid">
                    <div class="stat-card highlight">
                        <div class="stat-icon">📊</div>
                        <div id="totalBandwidth" class="stat-value">0 B/s</div>
                        <div class="stat-label">当前总带宽</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🔄</div>
                        <div id="activeDownloads" class="stat-value small">0</div>
                        <div class="stat-label">实时下载数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div id="totalDownloads" class="stat-value small">0</div>
                        <div class="stat-label">累计下载</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💾</div>
                        <div id="totalBytes" class="stat-value small">0 B</div>
                        <div class="stat-label">累计流量</div>
                    </div>
                </div>
            </div>

            <div class="card downloads-panel" style="animation-delay: 0.4s;">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7,10 12,15 17,10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    下载中的文件
                </div>
                <div id="downloadsList">
                    <div class="no-downloads">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7,10 12,15 17,10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <p>暂无下载任务</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAccelerateUrl = '';
        let statsInterval = null;

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatSpeed(bytesPerSecond) {
            if (bytesPerSecond === 0) return '0 B/s';
            return formatBytes(bytesPerSecond) + '/s';
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            const iconEl = statusEl.querySelector('.status-icon');
            const textEl = statusEl.querySelector('.status-text');
            
            textEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            
            if (type === 'success') {
                iconEl.textContent = '✓';
            } else {
                iconEl.textContent = '✕';
            }
        }

        function hideResultBox() {
            const resultBox = document.getElementById('resultBox');
            resultBox.classList.remove('show');
        }

        function showResultBox(url) {
            const resultBox = document.getElementById('resultBox');
            const resultUrl = document.getElementById('resultUrl');
            resultUrl.textContent = url;
            resultBox.classList.add('show');
            currentAccelerateUrl = url;
        }

        async function getAccelerateLink() {
            const fileUrl = document.getElementById('fileUrl').value.trim();
            
            if (!fileUrl) {
                showStatus('请输入文件链接', 'error');
                return;
            }
            
            try {
                new URL(fileUrl);
            } catch {
                showStatus('请输入有效的 URL 格式', 'error');
                return;
            }
            
            try {
                showStatus('正在生成加速链接...', 'success');
                
                const response = await fetch(`/api/accelerate?url=${encodeURIComponent(fileUrl)}`);
                const data = await response.json();
                
                if (data.success) {
                    showResultBox(data.data.accelerate_url);
                    showStatus('加速链接已生成！', 'success');
                } else {
                    showStatus(data.error || '生成失败', 'error');
                }
            } catch (error) {
                showStatus('网络错误，请重试', 'error');
            }
        }

        function copyLink() {
            if (!currentAccelerateUrl) return;
            
            navigator.clipboard.writeText(currentAccelerateUrl).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = '已复制!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = '复制链接';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        function startDownload() {
            const fileUrl = document.getElementById('fileUrl').value.trim();
            
            if (!fileUrl) {
                showStatus('请输入文件链接', 'error');
                return;
            }
            
            try {
                new URL(fileUrl);
            } catch {
                showStatus('请输入有效的 URL 格式', 'error');
                return;
            }
            
            showStatus('正在准备下载，请稍候...', 'success');
            
            const downloadUrl = '/download?url=' + encodeURIComponent(fileUrl);
            
            window.location.href = downloadUrl;
            
            setTimeout(() => {
                showStatus('下载已启动，如未开始请检查浏览器拦截', 'success');
            }, 1500);
        }

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                if (data.success) {
                    updateStats(data.data);
                }
            } catch (error) {
                console.error('获取统计失败:', error);
            }
        }

        function updateStats(data) {
            document.getElementById('totalBandwidth').textContent = formatSpeed(data.totalBandwidth);
            document.getElementById('activeDownloads').textContent = data.activeDownloads;
            document.getElementById('totalDownloads').textContent = data.totalDownloads;
            document.getElementById('totalBytes').textContent = formatBytes(data.totalBytesTransferred);
            
            const downloadsList = document.getElementById('downloadsList');
            
            if (data.downloads && data.downloads.length > 0) {
                downloadsList.innerHTML = data.downloads.map(dl => `
                    <div class="download-item">
                        <div class="download-header">
                            <div class="download-filename">${escapeHtml(dl.filename)}</div>
                            <div class="download-speed">${formatSpeed(dl.speed)}</div>
                        </div>
                        <div class="download-progress">
                            <div class="download-progress-bar" style="width: ${dl.progress}%"></div>
                        </div>
                        <div class="download-meta">
                            <span>${formatBytes(dl.bytesTransferred)} / ${dl.totalSize ? formatBytes(dl.totalSize) : '?'}</span>
                            <span>${dl.progress}%</span>
                        </div>
                    </div>
                `).join('');
            } else {
                downloadsList.innerHTML = `
                    <div class="no-downloads">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7,10 12,15 17,10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <p>暂无下载任务</p>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function startStatsPolling() {
            fetchStats();
            statsInterval = setInterval(fetchStats, 2000);
        }

        function stopStatsPolling() {
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
        }

        document.getElementById('fileUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getAccelerateLink();
            }
        });

        document.getElementById('fileUrl').addEventListener('input', function() {
            const statusEl = document.getElementById('statusMessage');
            if (statusEl.classList.contains('success') || statusEl.classList.contains('error')) {
                statusEl.className = 'status-message';
            }
            hideResultBox();
        });

        document.addEventListener('DOMContentLoaded', startStatsPolling);

        window.addEventListener('beforeunload', stopStatsPolling);
    </script>
</body>
</html>
