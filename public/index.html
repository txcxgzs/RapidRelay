<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidRelay - 文件加速下载服务</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #08080c;
            --bg-secondary: #0d0d14;
            --bg-card: rgba(13, 13, 20, 0.7);
            --accent: #00e5a0;
            --accent-dim: rgba(0, 229, 160, 0.15);
            --accent-glow: rgba(0, 229, 160, 0.4);
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse 40% 30% at 30% 20%, rgba(0, 229, 160, 0.08), transparent),
                radial-gradient(ellipse 35% 25% at 70% 80%, rgba(80, 80, 180, 0.06), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 640px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--accent), #00b87a);
            border-radius: 18px;
            margin-bottom: 24px;
            position: relative;
            box-shadow: 
                0 0 80px var(--accent-glow),
                0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(135deg, var(--accent), transparent 50%, #00b87a);
            border-radius: 20px;
            z-index: -1;
            opacity: 0.6;
        }

        .logo svg {
            width: 36px;
            height: 36px;
            color: var(--bg-primary);
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.15s forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            color: var(--accent);
            font-size: 18px;
            pointer-events: none;
        }

        .input {
            width: 100%;
            padding: 18px 18px 18px 52px;
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        .input:focus {
            border-color: var(--accent);
            background: rgba(0, 229, 160, 0.03);
            box-shadow: 0 0 40px var(--accent-dim);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00b87a);
            border: none;
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px var(--accent-dim);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .result {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .result-url {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            word-break: break-all;
            padding: 12px;
            background: var(--accent-dim);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .copy-btn {
            padding: 8px 14px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            background: var(--accent-dim);
            border: 1px solid rgba(0, 229, 160, 0.3);
            border-radius: 6px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(0, 229, 160, 0.25);
        }

        .copy-btn.copied {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .toast {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        .toast.success {
            background: var(--accent-dim);
            border: 1px solid rgba(0, 229, 160, 0.2);
            color: var(--accent);
        }

        .toast.error {
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.2);
            color: #ff6b6b;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 32px 0;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.3s forwards;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 16px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .stat:hover {
            border-color: var(--border-hover);
            background: rgba(0, 0, 0, 0.4);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .footer {
            margin-top: 48px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.4s forwards;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .github-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-2px);
        }

        .github-btn svg {
            width: 18px;
            height: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 32px;
            }

            .card {
                padding: 28px 24px;
            }

            .stats-bar {
                flex-wrap: wrap;
            }

            .stat {
                flex: 1 1 calc(50% - 8px);
            }

            .stat:first-child {
                flex: 1 1 100%;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </div>
            <h1>RapidRelay</h1>
            <p>高速文件加速下载服务</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label class="input-label">文件链接</label>
                <div class="input-wrap">
                    <span class="input-icon">🔗</span>
                    <input 
                        type="text" 
                        id="fileUrl" 
                        class="input" 
                        placeholder="粘贴 OneDrive、GitHub 等文件链接..."
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="getAccelerateLink()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    获取加速链接
                </button>
                <button class="btn btn-secondary" onclick="startDownload()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7,10 12,15 17,10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    直接下载
                </button>
            </div>

            <div id="result" class="result">
                <div class="result-label">加速链接</div>
                <div id="resultUrl" class="result-url"></div>
                <button id="copyBtn" class="copy-btn" onclick="copyLink()">复制链接</button>
            </div>

            <div id="toast" class="toast">
                <span id="toastIcon"></span>
                <span id="toastText"></span>
            </div>

            <div class="divider"></div>

            <div class="input-label" style="margin-bottom: 16px;">实时统计</div>
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="totalBandwidth">0 B/s</div>
                    <div class="stat-label">当前带宽</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="activeDownloads">0</div>
                    <div class="stat-label">实时下载</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalDownloads">0</div>
                    <div class="stat-label">累计下载</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalBytes">0 B</div>
                    <div class="stat-label">累计流量</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="https://github.com" target="_blank" class="github-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                View on GitHub
            </a>
        </div>
    </div>

    <script>
        let currentUrl = '';
        let statsInterval = null;

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatSpeed(bps) {
            return formatBytes(bps) + '/s';
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastText');
            
            text.textContent = message;
            toast.className = 'toast ' + type + ' show';
            icon.textContent = type === 'success' ? '✓' : '✕';
            
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showResult(url) {
            const result = document.getElementById('result');
            const resultUrl = document.getElementById('resultUrl');
            resultUrl.textContent = url;
            result.classList.add('show');
            currentUrl = url;
        }

        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }

        async function getAccelerateLink() {
            const fileUrl = document.getElementById('fileUrl').value.trim();
            
            if (!fileUrl) {
                showToast('请输入文件链接', 'error');
                return;
            }
            
            try {
                new URL(fileUrl);
            } catch {
                showToast('请输入有效的 URL', 'error');
                return;
            }
            
            try {
                showToast('正在生成...', 'success');
                const res = await fetch(`/api/accelerate?url=${encodeURIComponent(fileUrl)}`);
                const data = await res.json();
                
                if (data.success) {
                    showResult(data.data.accelerate_url);
                    showToast('加速链接已生成', 'success');
                } else {
                    showToast(data.error || '生成失败', 'error');
                }
            } catch {
                showToast('网络错误', 'error');
            }
        }

        function copyLink() {
            if (!currentUrl) return;
            
            navigator.clipboard.writeText(currentUrl).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制链接';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function startDownload() {
            const fileUrl = document.getElementById('fileUrl').value.trim();
            
            if (!fileUrl) {
                showToast('请输入文件链接', 'error');
                return;
            }
            
            try {
                new URL(fileUrl);
            } catch {
                showToast('请输入有效的 URL', 'error');
                return;
            }
            
            showToast('正在下载...', 'success');
            window.location.href = '/download?url=' + encodeURIComponent(fileUrl);
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.success) updateStats(data.data);
            } catch (e) {}
        }

        function updateStats(data) {
            document.getElementById('totalBandwidth').textContent = formatSpeed(data.totalBandwidth);
            document.getElementById('activeDownloads').textContent = data.activeDownloads;
            document.getElementById('totalDownloads').textContent = data.totalDownloads;
            document.getElementById('totalBytes').textContent = formatBytes(data.totalBytesTransferred);
        }

        function startPolling() {
            fetchStats();
            statsInterval = setInterval(fetchStats, 2000);
        }

        document.getElementById('fileUrl').addEventListener('keypress', e => {
            if (e.key === 'Enter') getAccelerateLink();
        });

        document.getElementById('fileUrl').addEventListener('input', hideResult);

        document.addEventListener('DOMContentLoaded', startPolling);
    </script>
</body>
</html>
